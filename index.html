<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etheria Restart: PvP Meta</title>
    <style>
        /* Полностью автономные стили */
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin: 0; font-size: 2rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
            border-left: 4px solid var(--primary);
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tier-badge {
            background: #1e40af;
            color: #bfdbfe;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
        }

        .units {
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .description {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .counter-section {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .counter-title {
            color: var(--danger);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .counter-text { color: #fecaca; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Etheria: Restart PvP Meta</h1>
            <p style="color: var(--text-dim)">Актуальные сборки команд и контрпики</p>
        </header>
        
        <div id="team-container" class="grid">
            <p>Загрузка команд из teams.json...</p>
        </div>
    </div>

    <script>
        async function loadTeams() {
            try {
                // Загружаем новый формат файла
                const response = await fetch('teams.json?v=' + Date.now());
                if (!response.ok) throw new Error('Файл teams.json не найден');
                const teams = await response.json();
                const container = document.getElementById('team-container');
                container.innerHTML = '';

                teams.forEach(team => {
                    // Собираем строку юнитов защиты (Анимус + Шелл)
                    const defenseUnits = team.defense
                        .map(d => `${d.animus} <small style="color:var(--text-dim)">(${d.shell})</small>`)
                        .join(' • ');

                    // Собираем все контрпаки в один блок
                    const countersHtml = team.counters.map(c => {
                        const units = c.formation
                            .map(u => `${u.animus} (${u.shell})`)
                            .join(', ');
                        return `
                            <div style="margin-bottom: 8px; border-bottom: 1px solid rgba(239,68,68,0.1); padding-bottom: 4px;">
                                <strong>${units}</strong><br>
                                <small>Win Rate: ${c.win_rate} | Patch: ${c.patch}</small>
                                ${c.notes ? `<br><i style="font-size: 0.8rem; color: #ffb1b1;">💡 ${c.notes}</i>` : ''}
                            </div>
                        `;
                    }).join('');

                    container.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <h2 style="margin:0; font-size: 1.2rem;">Team ${team.id}</h2>
                                <span class="tier-badge">Rank ${team.rank}</span>
                            </div>
                            <div class="units">${defenseUnits}</div>
                            ${team.defense_note ? `<p class="description" style="font-style:italic">Note: ${team.defense_note}</p>` : ''}
                            
                            <div class="counter-section">
                                <span class="counter-title">Эффективные контрпики:</span>
                                <div class="counter-text">${countersHtml || 'Данных пока нет'}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('team-container').innerHTML = `<p style="color:red">Ошибка: ${error.message}</p>`;
            }
        }
        loadTeams();
    </script>

</body>
</html>
