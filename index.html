<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Etheria: Restart PvP Meta</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-3xl font-bold mb-8 text-blue-400">PvP Сборки Etheria: Restart</h1>
    
    <div id="app" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Сюда JS вставит карточки команд -->
    </div>

    <script>
        const teams = [
            { name: "Cleave Setup", units: "Messiah, Liliam, Plume", counters: "Viper, Valyrian", tier: "S" },
            { name: "Bruiser Meta", units: "Rahu, Valyrian, Xuan Li", counters: "Holden, Messiah", tier: "A" }
        ];

        const container = document.getElementById('app');
        teams.forEach(team => {
            container.innerHTML += `
                <div class="bg-gray-800 p-6 rounded-lg border-l-4 border-blue-500 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">${team.name}</h2>
                        <span class="bg-blue-600 px-2 py-1 rounded text-sm">Tier ${team.tier}</span>
                    </div>
                    <p class="text-gray-400 mb-2"><strong>Состав:</strong> ${team.units}</p>
                    <div class="mt-4 p-3 bg-red-900/20 border border-red-900/50 rounded">
                        <p class="text-red-400 text-sm"><strong>Контрпики:</strong> ${team.counters}</p>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
