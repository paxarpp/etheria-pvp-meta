<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etheria Restart PvP</title>
    <!-- Используем официальный скрипт Tailwind версии 3 -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Резервные стили, если Tailwind заблокируется */
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .tier { background: #1d4ed8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 border-b border-slate-700 pb-4">Etheria PvP Meta</h1>
        
        <div id="team-container" class="grid gap-6">
            <p class="animate-pulse">Загрузка данных из teams.json...</p>
        </div>
    </div>

    <script>
        async function loadTeams() {
            try {
                // Добавляем параметр для сброса кеша, чтобы изменения в JSON виделись сразу
                const response = await fetch('teams.json?v=' + Date.now());
                if (!response.ok) throw new Error('Файл teams.json не найден');
                
                const teams = await response.json();
                const container = document.getElementById('team-container');
                container.innerHTML = '';

                teams.forEach(team => {
                    container.innerHTML += `
                        <div class="card shadow-xl border-l-4 border-blue-500">
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="text-xl font-bold text-white">${team.name}</h2>
                                <span class="tier uppercase font-bold">Tier ${team.tier}</span>
                            </div>
                            <div class="text-blue-300 font-mono mb-3">
                                ${team.units.join(' — ')}
                            </div>
                            <p class="text-slate-400 text-sm mb-4">${team.description}</p>
                            <div class="bg-red-500/10 border border-red-500/20 p-3 rounded text-sm">
                                <strong class="text-red-400 block mb-1 uppercase text-xs">Counter-picks:</strong>
                                <span class="text-red-200">${team.counters}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('team-container').innerHTML = 
                    `<div class="bg-red-900/50 p-4 rounded border border-red-500 text-red-200">
                        Ошибка: ${error.message}. <br>
                        Убедитесь, что файл <b>teams.json</b> лежит в корне репозитория.
                    </div>`;
            }
        }
        loadTeams();
    </script>
</body>
</html>
