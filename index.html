<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etheria Restart: PvP Meta</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <header class="mb-12 border-b border-slate-700 pb-6">
            <h1 class="text-4xl font-extrabold text-blue-400 tracking-tight">Etheria: Restart</h1>
            <p class="text-slate-400 mt-2">База PvP сборок и контрпиков</p>
        </header>

        <div id="team-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Сюда JS загрузит данные -->
            <p class="text-slate-500 italic">Загрузка сборок...</p>
        </div>
    </div>

    <script>
        // Функция для загрузки данных из JSON
        async function loadTeams() {
            try {
                const response = await fetch('teams.json'); // Читаем файл
                const teams = await response.json();
                const container = document.getElementById('team-container');
                
                container.innerHTML = ''; // Очищаем текст загрузки

                teams.forEach(team => {
                    const card = `
                        <div class="bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700 hover:border-blue-500 transition-all">
                            <div class="flex justify-between items-start mb-4">
                                <h2 class="text-2xl font-bold text-white">${team.name}</h2>
                                <span class="bg-blue-900 text-blue-200 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                    Tier ${team.tier}
                                </span>
                            </div>
                            
                            <div class="mb-4">
                                <span class="text-slate-500 text-sm block mb-1 font-semibold uppercase">Состав:</span>
                                <p class="text-blue-300 font-medium italic text-lg">${team.units.join(' • ')}</p>
                            </div>

                            <p class="text-slate-400 text-sm mb-4 leading-relaxed">${team.description}</p>

                            <div class="bg-red-900/10 border border-red-900/30 p-3 rounded-lg">
                                <span class="text-red-400 text-xs font-bold uppercase block mb-1">Чем контрится:</span>
                                <p class="text-red-200 text-sm">${team.counters}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('team-container').innerHTML = '<p class="text-red-400">Ошибка при загрузке команд.</p>';
            }
        }

        // Запускаем при загрузке страницы
        loadTeams();
    </script>
</body>
</html>
