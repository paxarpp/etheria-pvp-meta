<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etheria Restart: PvP Meta</title>
    <style>
        /* Полностью автономные стили */
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin: 0; font-size: 2rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
            border-left: 4px solid var(--primary);
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tier-badge {
            background: #1e40af;
            color: #bfdbfe;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
        }

        .units {
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .description {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .counter-section {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .counter-title {
            color: var(--danger);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .counter-text { color: #fecaca; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">

        <div style="margin-bottom: 20px;">
            <input type="text" id="hero-search" placeholder="Поиск по персонажу (например, Lowan)..." 
                style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; box-sizing: border-box;">
        </div>
        
        <header>
            <h1>Etheria: Restart PvP Meta</h1>
            <p style="color: var(--text-dim)">Актуальные сборки команд и контрпики</p>
        </header>
        
        <div id="team-container" class="grid">
            <p>Загрузка команд из teams.json...</p>
        </div>
    </div>

    <script>
        let allTeams = [];

        async function loadTeams() {
            try {
                const response = await fetch('teams.json?v=' + Date.now());
                if (!response.ok) throw new Error('Файл teams.json не найден');
                allTeams = await response.json();
                
                renderTeams(allTeams); // Первичная отрисовка
            } catch (error) {
                document.getElementById('team-container').innerHTML = `<p style="color:red">Ошибка: ${error.message}</p>`;
            }
        }
        
        function renderTeams(teams) {
            const container = document.getElementById('team-container');
            container.innerHTML = '';
        
            if (teams.length === 0) {
                container.innerHTML = '<p style="color:var(--text-dim)">Ничего не найдено...</p>';
                return;
            }
        
            teams.forEach(team => {
                const defenseUnits = (team.defense || [])
                    .map(d => `${d.animus} <small style="color:var(--text-dim)">(${d.shell || ''})</small>`)
                    .join(' • ');
        
                const countersHtml = (team.counters || []).map(c => {
                    const units = (c.formation || []).map(u => `${u.animus} (${u.shell || ''})`).join(', ');
                    return `
                        <div style="margin-bottom: 12px; border-bottom: 1px solid rgba(239,68,68,0.1); padding-bottom: 8px;">
                            <strong style="display:block; color:#fecaca;">${units}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-dim);">
                                WR: <span style="color:#4ade80">${c.win_rate || 'N/A'}</span> | Patch: ${c.patch || '-'}
                            </div>
                        </div>
                    `;
                }).join('');
        
                container.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <h2 style="margin:0; font-size: 1.2rem;">${team.id}</h2>
                            <span class="tier-badge">Rank ${team.rank}</span>
                        </div>
                        <div class="units">${defenseUnits}</div>
                        <div class="counter-section">
                            <span class="counter-title">Контрпики:</span>
                            <div class="counter-text" style="margin-top:10px;">${countersHtml || 'Нет данных'}</div>
                        </div>
                    </div>
                `;
            });
        }
        
        document.getElementById('hero-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            const filtered = allTeams.filter(team => {
                const inDefense = team.defense?.some(d => d.animus.toLowerCase().includes(query));
                const inCounters = team.counters?.some(c => 
                    c.formation?.some(u => u.animus.toLowerCase().includes(query))
                );
                return inDefense || inCounters;
            });
        
            renderTeams(filtered);
        });
        
        loadTeams();

    </script>
</body>
</html>
