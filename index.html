<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etheria Restart: PvP Meta</title>
    <style>
        /* Полностью автономные стили */
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); margin: 0; font-size: 2rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
            border-left: 4px solid var(--primary);
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tier-badge {
            background: #1e40af;
            color: #bfdbfe;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: bold;
        }

        .units {
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .description {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .counter-section {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .counter-title {
            color: var(--danger);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .counter-text { color: #fecaca; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">

        <div style="margin-bottom: 20px;">
            <input type="text" id="hero-search" placeholder="Поиск по персонажу (например, Lowan)..." 
                style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; box-sizing: border-box;">
        </div>
        
        <header>
            <h1>Etheria: Restart PvP Meta</h1>
            <p style="color: var(--text-dim)">Актуальные сборки команд и контрпики</p>
        </header>
        
        <div id="team-container" class="grid">
            <p>Загрузка команд...</p>
        </div>
    </div>

    <script>
        const translate = {
            // Персонажи (Animus)
            "Airon": "Айрон",
            "Alicorn": "Аликорн",
            "Asal": "Асал",
            "Beyontin": "Бейонтин",
            "Bornova": "Борнова",
            "Cachi": "Качи",
            "Celince": "Селинс",
            "Chiaki": "Тиаки",
            "DokiDoki": "Доки-Доки",
            "Fiamelia": "Фиамелия",
            "Fortissimo": "Фортиссимо",
            "Fuqiu": "Фуцю",
            "Gianc": "Джанк",
            "GigaByte": "Гигабайт",
            "Heinrich": "Генрих",
            "Holden": "Холден",
            "Hoyan": "Хоян",
            "Kethos": "Кетос",
            "Kokardi": "Кокарди",
            "Liliam": "Лилиам",
            "Lily": "Лили",
            "Lingluo": "Линлуо",
            "Lowan": "Лован",
            "Massiah": "Мессия",
            "Mia": "Мия",
            "Mio": "Мио",
            "Mizuki Makoto": "Мидзуки Макото",
            "Mizusumi Aya": "Мидзусуми Ая",
            "Nahor": "Нахор",
            "Nevette": "Неветт",
            "Ninfoniel": "Нинфониэль",
            "Palin": "Палин",
            "Plume": "Плюм",
            "RC-77": "РЦ-77",
            "Rahu": "Раху",
            "Raymerry": "Рэймэрри",
            "Rosa": "Роза",
            "Sania": "Сания",
            "Santik": "Сантик",
            "Senyu": "Сэнью",
            "Sylph": "Сильф",
            "The Lumiwarden Diting": "Хранитель Света Дитин",
            "Tiamat": "Тиамат",
            "Tsukiyo Mi": "Цукиё Ми",
            "Turandot": "Турандот",
            "Valerian": "Валериан",
            "Veronika": "Вероника",
            "Xiada": "Сяда",
            "Xuan Li": "Сюань Ли",
            "Yeli": "Ели",
        
            // Оболочки / Артефакты (Shells)
            "Amber": "Амбер (Янтарь)",
            "Artisan": "Ремесленник",
            "Champion Gator": "Чемпион Аллигатор",
            "Codex of Magic": "Кодекс Магии",
            "Count": "Граф",
            "Doom Crow": "Ворон Рока",
            "Halloween": "Хэллоуин",
            "Jackal Guard": "Страж Шакала",
            "Law of Silence": "Закон Тишины",
            "Lighthouse": "Маяк",
            "Moon Bunny": "Лунная Зайка",
            "Ouroboros": "Уроборос",
            "Reaper Steps": "Шаги Жнеца",
            "Revelation": "Откровение",
            "Supernova": "Сверхновая",
            "Sword VII": "Меч VII",
            "White Fang": "Белый Клык"
        };

        let allTeams = [];

        async function loadTeams() {
            try {
                const response = await fetch('teams.json?v=' + Date.now());
                if (!response.ok) throw new Error('Файл teams.json не найден');
                allTeams = await response.json();
                
                renderTeams(allTeams); // Первичная отрисовка
            } catch (error) {
                document.getElementById('team-container').innerHTML = `<p style="color:red">Ошибка: ${error.message}</p>`;
            }
        }

const t = (name) => translate[name] || name;

function renderTeams(teams) {
    const container = document.getElementById('team-container');
    container.innerHTML = '';

    if (teams.length === 0) {
        container.innerHTML = '<p style="color:var(--text-dim)">Ничего не найдено...</p>';
        return;
    }

    teams.forEach(team => {
        // 1. Отрисовка защиты (Defense)
        const defenseUnits = (team.defense || []).map(d => `
            <div style="margin-bottom:6px;">
                <div style="font-weight:bold; color:#93c5fd; font-size:0.95rem;">
                    ${t(d.animus)} <span style="font-weight:normal; opacity:0.5; font-size:0.8rem;">(${d.animus})</span>
                </div>
                <div style="font-size:0.8rem; color:var(--text-dim)">
                    ${t(d.shell)} <span style="opacity:0.5;">(${d.shell})</span>
                </div>
            </div>
        `).join('');

        // 2. Отрисовка контрпиков (Counters)
        const countersHtml = (team.counters || []).map(c => {
            const units = (c.formation || []).map(u => `
                <div style="margin-bottom:4px; font-size:0.85rem;">
                    <span style="color:#fecaca;">${t(u.animus)}</span> 
                    <span style="opacity:0.5; font-size:0.75rem;">(${u.animus})</span>
                    ${u.shell ? `<br><small style="color:var(--text-dim); margin-left:10px;">└ ${t(u.shell)} (${u.shell})</small>` : ''}
                </div>
            `).join('');

            return `
                <div style="margin-bottom: 12px; border-bottom: 1px solid rgba(239,68,68,0.1); padding-bottom: 8px;">
                    <div style="margin-bottom:5px;">${units}</div>
                    <div style="font-size: 0.75rem; color: var(--text-dim);">
                        WR: <span style="color:#4ade80">${c.win_rate || '100%'}</span> | Patch: ${c.patch || '-'}
                    </div>
                    ${c.notes ? `<div style="font-size: 0.75rem; color: #fbbf24; margin-top: 4px;">💡 ${c.notes}</div>` : ''}
                </div>
            `;
        }).join('');

        container.innerHTML += `
            <div class="card">
                <div class="card-header">
                </div>
                <div style="margin-bottom:15px; border-left: 2px solid #334155; padding-left: 10px;">
                    ${defenseUnits}
                </div>
                ${team.defense_note ? `<p style="font-size:0.8rem; color:#fbbf24; font-style:italic;">Note: ${team.defense_note}</p>` : ''}
                <div class="counter-section">
                    <span class="counter-title">Counter Formations:</span>
                    <div class="counter-text" style="margin-top:8px;">${countersHtml || 'No Data'}</div>
                </div>
            </div>
        `;
    });
}

// Умный поиск (ищет по EN и RU)
document.getElementById('hero-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allTeams.filter(team => {
        const check = (u) => {
            if (!u) return false;
            const nameEn = (u.animus || "").toLowerCase();
            const nameRu = (translate[u.animus] || "").toLowerCase();
            return nameEn.includes(q) || nameRu.includes(q);
        };
        return (team.defense || []).some(check) || (team.counters || []).some(c => c.formation?.some(check));
    });
    renderTeams(filtered);
});
        
        loadTeams();

    </script>
</body>
</html>
